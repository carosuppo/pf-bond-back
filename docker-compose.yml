services:
  postgres:
    image: postgres:17-alpine
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    container_name: bond-bd
    restart: always
    env_file:
      - .env
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nest_network

  backend:
    build:
      context: .
      target: dev
    container_name: bond-back
    restart: always
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    volumes:
      - backend_logs:/usr/src/app/logs
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.PORT ?? '3000') + '/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npm run start:dev"
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - nest_network
    develop:
      watch:
        - action: sync
          path: ./src
          target: /usr/src/app/src
        - action: sync+restart
          path: ./prisma/schema.prisma
          target: /usr/src/app/prisma/schema.prisma
        - action: rebuild
          path: package.json

volumes:
  postgres_data:
  backend_logs:
    name: bond-backend-dev-logs

networks:
  nest_network:
    driver: bridge
